    <meta name="color-scheme" content="dark" />
    <!-- Space Grotesk for headings and figures, IBM Plex Sans for body copy.
         Both are intentionally specific: the Inter/Roboto default is what makes
         a dashboard read as an unmodified template. preconnect avoids a stall. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <title>AN Telemetry</title>
    <meta name="description" content="AN Telemetry — monitoring jaringan rumah" />

      rel="icon"

    />
